name: Deploy AI Image Chatbot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Verify React build
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: Forma
          publish-profile: ${{ secrets.CHATBOT }}
          package: .
